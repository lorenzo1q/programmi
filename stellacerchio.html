<html>
 <head>
   <meta charset = "utf-8">
   <title>Stella Proporzionata ai Margini</title>
 </head>
 <body>
   <canvas id = "drawLines" width = "400" height = "200" 
     style = "border: 1px solid Black;">
   </canvas>
   <script>
     var canvas = document.getElementById("drawLines");
     var context = canvas.getContext("2d");

     context.beginPath(); 
     
     // 1. PUNTA SUPERIORE: y=0 (Tocca il margine alto)
     context.moveTo(200, 0); 
     
     // 2. Rientranza destra superiore
     context.lineTo(223, 72);
     
     // 3. PUNTA DESTRA (Proporzionata, non tocca il bordo x=400)
     context.lineTo(295, 72); 
     
     // 4. Rientranza destra inferiore
     context.lineTo(237, 116);
     
     // 5. PUNTA BASSO DESTRA: y=200 (Tocca il margine basso)
     context.lineTo(259, 190); 
     
     // 6. Rientranza centrale basso
     context.lineTo(200, 147);
     
     // 7. PUNTA BASSO SINISTRA: y=200 (Tocca il margine basso)
     context.lineTo(141, 190); 
     
     // 8. Rientranza sinistra inferiore
     context.lineTo(163, 116);
     
     // 9. PUNTA SINISTRA (Proporzionata, non tocca il bordo x=0)
     context.lineTo(105, 72); 
     
     // 10. Rientranza sinistra superiore
     context.lineTo(177, 72);
     
     context.closePath(); 
     
     // Stile
     context.fillStyle = "gold";
     context.fill();
     context.strokeStyle = "black";
     context.lineWidth = 2;
     context.stroke();
   </script>
 </body>
</html>
