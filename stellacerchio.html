<html>
 <head>
   <meta charset = "utf-8">
   <title>Stella ai Margini Esatti</title>
 </head>
 <body>
   <canvas id = "drawLines" width = "400" height = "200" 
     style = "border: 1px solid Black;">
   </canvas>
   <script>
     var canvas = document.getElementById("drawLines");
     var context = canvas.getContext("2d");

     context.beginPath(); 
     
     // 1. PUNTA SUPERIORE: y=0 (Tocca il bordo in alto)
     context.moveTo(200, 0); 
     
     // 2. Rientranza destra-alto
     context.lineTo(250, 75);
     
     // 3. PUNTA DESTRA: x=400 (Tocca il bordo destro)
     context.lineTo(400, 75); 
     
     // 4. Rientranza destra-basso
     context.lineTo(280, 125);
     
     // 5. PUNTA BASSO-DESTRA: y=200 (Tocca il bordo in basso)
     context.lineTo(330, 200); 
     
     // 6. Rientranza centrale basso
     context.lineTo(200, 150);
     
     // 7. PUNTA BASSO-SINISTRA: y=200 (Tocca il bordo in basso)
     context.lineTo(70, 200); 
     
     // 8. Rientranza sinistra-basso
     context.lineTo(120, 125);
     
     // 9. PUNTA SINISTRA: x=0 (Tocca il bordo sinistro)
     context.lineTo(0, 75); 
     
     // 10. Rientranza sinistra-alto
     context.lineTo(150, 75);
     
     context.closePath(); 
     
     // Stile: usiamo fill per assicurarci che il colore arrivi al bordo
     context.fillStyle = "gold";
     context.fill();
     
     // Il tratto (stroke)
     context.strokeStyle = "black";
     context.lineWidth = 1;
     context.stroke();
   </script>
 </body>
</html>
