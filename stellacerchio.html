<!DOCTYPE html>
<html>
 <head>
   <meta charset = "utf-8">
   <title>Stella nel Cerchio</title>
 </head>
 <body>
   <canvas id = "drawLines" width = "400" height = "200" 
     style = "border: 1px solid Black;">
   </canvas>
   
   <script>
     var canvas = document.getElementById("drawLines");
     var context = canvas.getContext("2d");

     // --- DISEGNO DEL CERCHIO ---
     context.beginPath();
     // Centro (200, 100), Raggio 100, da 0 a 2*PI (giro completo)
     context.arc(200, 100, 100, 0, 2 * Math.PI);
     context.strokeStyle = "lightgray"; // Colore cerchio
     context.lineWidth = 1;
     context.stroke();

     // --- DISEGNO DELLA STELLA ---
     context.beginPath(); 
     // Punta superiore (Tocca il margine alto e il cerchio)
     context.moveTo(200, 0);   
     context.lineTo(225, 75);   
     context.lineTo(295, 75);   
     context.lineTo(235, 120);  
     // Punta in basso a destra (Tocca il margine basso e il cerchio)
     context.lineTo(259, 195);  
     context.lineTo(200, 150);  
     // Punta in basso a sinistra (Tocca il margine basso e il cerchio)
     context.lineTo(141, 195);  
     context.lineTo(165, 120);  
     context.lineTo(105, 75);   
     context.lineTo(175, 75);   
     
     context.closePath(); 
     
     // Stile stella
     context.lineWidth = 2;
     context.strokeStyle = "blue";
     context.stroke();
     context.fillStyle = "gold";
     context.fill();
   </script>
 </body>
</html>
