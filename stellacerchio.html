<html>
 <head>
   <meta charset = "utf-8">
   <title>Drawing Lines - Stella ai Margini</title>
 </head>
 <body>
   <canvas id = "drawLines" width = "400" height = "200" 
     style = "border: 1px solid Black;">
   </canvas>
   <script>
     var canvas = document.getElementById("drawLines");
     var context = canvas.getContext("2d");

     context.beginPath(); 
     // Punta superiore: tocca il margine alto (y = 0)
     context.moveTo(200, 0); 
     
     context.lineTo(235, 75);
     // Punta destra
     context.lineTo(380, 75); 
     
     context.lineTo(265, 125);
     // Punta basso destra: tocca il margine basso (y = 200)
     context.lineTo(310, 200); 
     
     context.lineTo(200, 150);
     // Punta basso sinistra: tocca il margine basso (y = 200)
     context.lineTo(90, 200); 
     
     context.lineTo(135, 125);
     // Punta sinistra
     context.lineTo(20, 75); 
     
     context.lineTo(165, 75);
     
     context.closePath(); // Torna alla punta superiore (200, 0)
     
     // Stile
     context.strokeStyle = "black";
     context.lineWidth = 2;
     context.stroke();
     
     // Riempimento opzionale per vedere meglio la forma
     context.fillStyle = "gold";
     context.fill();
   </script>
 </body>
</html>
