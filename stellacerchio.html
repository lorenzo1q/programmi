<!DOCTYPE html>
<html>
 <head>
   <meta charset = "utf-8">
   <title>Stella nel Cerchio Visibile</title>
 </head>
 <body>
   <canvas id = "drawLines" width = "400" height = "200" 
     style = "border: 1px solid Black;">
   </canvas>
   
   <script>
     var canvas = document.getElementById("drawLines");
     var context = canvas.getContext("2d");

     // Centro del canvas
     var centerX = 200;
     var centerY = 100;
     var raggio = 98; // Usiamo 98 invece di 100 per non farlo sparire sul bordo

     // 1. DISEGNO DEL CERCHIO (lo facciamo rosso per vederlo bene)
     context.beginPath();
     context.arc(centerX, centerY, raggio, 0, 2 * Math.PI);
     context.strokeStyle = "red"; 
     context.lineWidth = 2;
     context.stroke();

     // 2. DISEGNO DELLA STELLA
     context.beginPath(); 
     // Punta superiore: y = centerY - raggio (2 pixel sotto il bordo)
     context.moveTo(centerX, centerY - raggio); 
     
     context.lineTo(225, 75);
     context.lineTo(295, 75); 
     context.lineTo(235, 120);
     
     // Punta basso destra: calcolata per toccare il cerchio
     context.lineTo(258, 178); 
     
     context.lineTo(200, 145);
     
     // Punta basso sinistra: calcolata per toccare il cerchio
     context.lineTo(142, 178); 
     
     context.lineTo(165, 120);
     context.lineTo(105, 75); 
     context.lineTo(175, 75);
     
     context.closePath(); 
     
     // Stile stella
     context.lineWidth = 2;
     context.strokeStyle = "blue";
     context.stroke();
     context.fillStyle = "rgba(255, 215, 0, 0.5)"; // Oro trasparente per vedere il cerchio sotto
     context.fill();
   </script>
 </body>
</html>
