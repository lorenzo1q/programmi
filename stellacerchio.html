<!DOCTYPE html>
<html>
    <head>
   <meta charset = "utf-8">
   <title>Drawing Lines</title>
 </head>
 <body>
   <canvas id = "drawLines" width = "400" height = "200" 
     style = "border: 1px solid Black;">
   </canvas>
   
   <script>
     var canvas = document.getElementById("drawLines");
     var context = canvas.getContext("2d");

     context.beginPath(); 
     // Spostiamo le coordinate per farle stare nel canvas 400x200
     context.moveTo(200, 20);   // Punta superiore
     context.lineTo(225, 80);   // Rientranza destra superiore
     context.lineTo(290, 80);   // Punta destra
     context.lineTo(235, 120);  // Rientranza destra inferiore
     context.lineTo(260, 180);  // Punta in basso a destra
     context.lineTo(200, 140);  // Rientranza centrale basso
     context.lineTo(140, 180);  // Punta in basso a sinistra
     context.lineTo(165, 120);  // Rientranza sinistra inferiore
     context.lineTo(110, 80);   // Punta sinistra
     context.lineTo(175, 80);   // Rientranza sinistra superiore
     
     context.closePath();       // Chiude la figura tornando al punto iniziale
     
     // Stile
     context.lineWidth = 2;
     context.strokeStyle = "blue";
     context.stroke();
     
     // Opzionale: riempimento
     context.fillStyle = "gold";
     context.fill();
   </script>
 </body>
</html>
