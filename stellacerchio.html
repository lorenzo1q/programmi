<html>
 <head>
   <meta charset = "utf-8">
   <title>Drawing Lines - Stella ai Margini</title>
 </head>
 <body>
   <canvas id = "drawLines" width = "400" height = "200" 
     style = "border: 1px solid Black;">
   </canvas>
   <script>
     var canvas = document.getElementById("drawLines");
     var context = canvas.getContext("2d");

     context.beginPath(); 
     
     // 1. PUNTA SUPERIORE: y = 0 (Tocca il margine alto)
     context.moveTo(200, 0); 
     
     // 2. Rientranza destra superiore
     context.lineTo(245, 70);
     
     // 3. PUNTA DESTRA: x = 400 (Tocca il margine destro)
     context.lineTo(400, 70); 
     
     // 4. Rientranza destra inferiore
     context.lineTo(275, 120);
     
     // 5. PUNTA BASSO DESTRA: y = 200 (Tocca il margine basso)
     context.lineTo(325, 200); 
     
     // 6. Rientranza centrale basso
     context.lineTo(200, 155);
     
     // 7. PUNTA BASSO SINISTRA: y = 200 (Tocca il margine basso)
     context.lineTo(75, 200); 
     
     // 8. Rientranza sinistra inferiore
     context.lineTo(125, 120);
     
     // 9. PUNTA SINISTRA: x = 0 (Tocca il margine sinistro)
     context.lineTo(0, 70); 
     
     // 10. Rientranza sinistra superiore
     context.lineTo(155, 70);
     
     context.closePath(); 
     
     // Stile
     context.strokeStyle = "red";
     context.lineWidth = 2;
     context.stroke();
     
     context.fillStyle = "gold";
     context.fill();
   </script>
 </body>
</html>
