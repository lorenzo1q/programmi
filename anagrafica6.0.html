<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagrafica Utente</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            min-height: 900px;
        }
        .error-msg {
            color: red;
            font-size: 0.8em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>Inserisci Anagrafica Utente</h2>
    <form id="anagraficaForm">
        <div class="container">
            <div>
                <label>Nome:</label><br>
                <input type="text" id="nome" required>
                <div id="pNomeTest" class="error-msg"></div>
            </div>

            <div>
                <label>Cognome:</label><br>
                <input type="text" id="cognome" required>
                <div id="pCognomeTest" class="error-msg"></div>
            </div>

            <div>
                <label>Email:</label><br>
                <input type="text" id="email" required>
                <div id="pEmailTest" class="error-msg"></div>
            </div>

            <div>
                <label>Codice fiscale:</label><br>
                <input type="text" id="codFiscale" required>
                <div id="pCodFiscaleTest" class="error-msg"></div>
            </div>

            <div>
                <label>Indirizzo:</label><br>
                <input type="text" id="indirizzo" required>
                <div id="pIndirizzoTest" class="error-msg"></div>
            </div>

            <div>
                <label>Città:</label><br>
                <input type="text" id="citta" required>
                <div id="pCittaTest" class="error-msg"></div>
            </div>

            <div>
                <label>CAP:</label><br>
                <input type="text" id="cap" required>
                <div id="pCapTest" class="error-msg"></div>
            </div>

            <div>
                <label>Provincia:</label><br>
                <select id="provincia" name="provincia">
                    <option value="milano">milano</option>
                    <option value="novara">novara</option>
                    <option value="monza">monza</option>
                </select>
            </div>

            <div>
                <label>Sesso:</label><br>
                <input type="radio" name="sesso" id="m" value="maschio">
                <label for="m">maschio</label><br>
                <input type="radio" name="sesso" id="f" value="femmina">
                <label for="f">femmina</label><br>
                <input type="radio" name="sesso" id="a" value="altro">
                <label for="a">altro</label><br>
            </div>

            <div>
                <label>Data di nascita:</label><br>
                <input type="date" id="dataNascita" required>
            </div>

            <div>
                <label>Anno di nascita (per verifica):</label><br>
                <input type="text" id="annoNascita" placeholder="es. 1990">
                <div id="pAnnoNascitaTest" class="error-msg"></div>
            </div>

            <div>
                <label>Mezzo di trasporto:</label><br>
                <label for="box1">ho un auto</label>
                <input type="checkbox" id="box1" name="auto" value="auto"><br>
                <label for="box2">ho una bici</label>
                <input type="checkbox" id="box2" name="bici" value="bici"><br>
                <label for="box3">ho un cavallo</label>
                <input type="checkbox" id="box3" name="cavallo" value="cavallo"><br>
            </div>

            <div>
                <label>Materie preferite:</label><br>
                <select name="materie_preferite" id="materie" multiple>
                    <option value="motoria">motoria</option>
                    <option value="storia">storia</option>
                    <option value="inglese">inglese</option>
                </select>
            </div>
        </div>

        <a href="stampa.html">Stampa</a><br>
        <button type="button" onclick="eseguiTutto()" style="margin-top:30px">Invia</button>
    </form>

    <div class="output" id="risultato">
        <div id="outnome"></div>
        <div id="outcognome"></div>
        <div id="outemail"></div>
        <div id="outcodice"></div>
        <div id="outindirizzo"></div>
        <div id="outcitta"></div>
        <div id="outcap"></div>
        <div id="outdatanascita"></div>
        <div id="outsesso"></div>
        <div id="outmezzi"></div>
        <div id="outprovincia"></div>
    </div>

    <script>
        // FIX 1: carica i dati esistenti dal localStorage
        let elenco = JSON.parse(localStorage.getItem("elenco")) || [];

        function controlla() {
            let flag = false;

            // FIX 2: tutti i regex usano escape Unicode \uXXXX al posto di caratteri diretti
            let nomeTest = document.getElementById("nome").value;
            const nomeRegex = /^[A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF\s'\-]{2,50}$/;
            if (!nomeRegex.test(nomeTest)) {
                document.getElementById("pNomeTest").innerHTML = "Nome non valido!";
                flag = true;
            } else {
                document.getElementById("pNomeTest").innerHTML = "";
            }

            let cognomeTest = document.getElementById("cognome").value;
            const cognomeRegex = /^[A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF\s'\-]{2,50}$/;
            if (!cognomeRegex.test(cognomeTest)) {
                document.getElementById("pCognomeTest").innerHTML = "Cognome non valido!";
                flag = true;
            } else {
                document.getElementById("pCognomeTest").innerHTML = "";
            }

            let emailTest = document.getElementById("email").value;
            const emailRegex = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/;
            if (!emailRegex.test(emailTest)) {
                document.getElementById("pEmailTest").innerHTML = "Email non valida!";
                flag = true;
            } else {
                document.getElementById("pEmailTest").innerHTML = "";
            }

            let codFiscaleTest = document.getElementById("codFiscale").value;
            const codFiscaleRegex = /^[A-Z]{6}[0-9]{2}[ABEHLMPRST][0-9]{2}[A-Z][0-9]{3}[A-Z]$/;
            if (!codFiscaleRegex.test(codFiscaleTest)) {
                document.getElementById("pCodFiscaleTest").innerHTML = "Codice Fiscale non valido!";
                flag = true;
            } else {
                document.getElementById("pCodFiscaleTest").innerHTML = "";
            }

            let cittaTest = document.getElementById("citta").value;
            const cittaRegex = /^[A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF\s'\-]{2,50}$/;
            if (!cittaRegex.test(cittaTest)) {
                document.getElementById("pCittaTest").innerHTML = "Città non valida!";
                flag = true;
            } else {
                document.getElementById("pCittaTest").innerHTML = "";
            }

            let indirizzoTest = document.getElementById("indirizzo").value;
            const indirizzoRegex = /^[A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF0-9\s.,'\-\/]{5,100}$/;
            if (!indirizzoRegex.test(indirizzoTest)) {
                document.getElementById("pIndirizzoTest").innerHTML = "Indirizzo non valido!";
                flag = true;
            } else {
                document.getElementById("pIndirizzoTest").innerHTML = "";
            }

            let capTest = document.getElementById("cap").value;
            const capRegex = /^\d{5}$/;
            if (!capRegex.test(capTest)) {
                document.getElementById("pCapTest").innerHTML = "CAP non valido!";
                flag = true;
            } else {
                document.getElementById("pCapTest").innerHTML = "";
            }

            // FIX 3: verifica che l'anno inserito corrisponda alla data di nascita
            let annoTest = document.getElementById("annoNascita").value;
            const annoRegex = /^(19\d{2}|20\d{2})$/;
            if (!annoRegex.test(annoTest)) {
                document.getElementById("pAnnoNascitaTest").innerHTML = "Anno di nascita non valido!";
                flag = true;
            } else {
                let dataNascitaInput = document.getElementById("dataNascita").value;
                if (dataNascitaInput) {
                    let annoData = new Date(dataNascitaInput).getFullYear();
                    if (parseInt(annoTest) !== annoData) {
                        document.getElementById("pAnnoNascitaTest").innerHTML = "Anno non corrisponde alla data di nascita!";
                        flag = true;
                    } else {
                        document.getElementById("pAnnoNascitaTest").innerHTML = "";
                    }
                } else {
                    document.getElementById("pAnnoNascitaTest").innerHTML = "";
                }
            }

            return flag;
        }

        function calcolaGenerazione() {
            let dataNascitaInput = document.getElementById("dataNascita").value;
            let sessoInput = document.querySelector('input[name="sesso"]:checked');
            let mezziInput = document.querySelectorAll('input[type="checkbox"]:checked');

            // FIX 4: mezziSelezionati viene salvato dentro persona
            let mezziSelezionati = [];
            mezziInput.forEach(function(checkbox) {
                mezziSelezionati.push(checkbox.value);
            });

            let persona = {
                nome: document.getElementById("nome").value,
                cognome: document.getElementById("cognome").value,
                email: document.getElementById("email").value,
                codice: document.getElementById("codFiscale").value,
                indirizzo: document.getElementById("indirizzo").value,
                citta: document.getElementById("citta").value,
                cap: document.getElementById("cap").value,
                dataNascita: dataNascitaInput,
                sesso: sessoInput ? sessoInput.value : "N/D",
                provincia: document.getElementById("provincia").value,
                anno: new Date(dataNascitaInput).getFullYear(),
                mezzi: mezziSelezionati
            };

            let generazione = "";
            if (persona.anno >= 1901 && persona.anno <= 1927) generazione = "Greatest Generation";
            else if (persona.anno >= 1928 && persona.anno <= 1945) generazione = "Generazione Silenziosa";
            else if (persona.anno >= 1946 && persona.anno <= 1964) generazione = "Baby Boomers";
            else if (persona.anno >= 1965 && persona.anno <= 1980) generazione = "Generazione X";
            else if (persona.anno >= 1981 && persona.anno <= 1996) generazione = "Millennials";
            else if (persona.anno >= 1997 && persona.anno <= 2012) generazione = "Generazione Z";
            else if (persona.anno >= 2013) generazione = "Generazione Alpha";
            else generazione = "Anno non valido";

            persona.generazione = generazione;

            let outputMezzi = mezziSelezionati.length > 0 ? mezziSelezionati.join(", ") : "nessuno";

            document.getElementById("outnome").innerHTML = "Nome: " + persona.nome;
            document.getElementById("outcognome").innerHTML = "Cognome: " + persona.cognome;
            document.getElementById("outemail").innerHTML = "Email: " + persona.email;
            document.getElementById("outcodice").innerHTML = "Cod. Fiscale: " + persona.codice;
            document.getElementById("outindirizzo").innerHTML = "Indirizzo: " + persona.indirizzo;
            document.getElementById("outcitta").innerHTML = "Citt\u00E0: " + persona.citta;
            document.getElementById("outcap").innerHTML = "CAP: " + persona.cap;
            document.getElementById("outdatanascita").innerHTML = "Data: " + persona.dataNascita + " (" + generazione + ")";
            document.getElementById("outsesso").innerHTML = "Sesso: " + persona.sesso;
            document.getElementById("outprovincia").innerHTML = "Provincia: " + persona.provincia;
            document.getElementById("outmezzi").innerHTML = "Mezzi: " + outputMezzi;

            elenco.push(persona);
            localStorage.setItem("elenco", JSON.stringify(elenco));
        }

        function eseguiTutto() {
            let erroriPresenti = controlla();
            if (!erroriPresenti) {
                calcolaGenerazione();
            }
        }
    </script>
</body>

</html>
