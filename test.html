<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo e Output Dinamico</title>
    <style>
        /* CSS per il layout e lo stile */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex; /* Abilita flexbox per affiancare gli elementi */
            gap: 20px;
        }

        #modulo-container {
            flex: 1; /* Occupa 1/3 dello spazio disponibile */
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        #output-container {
            flex: 2; /* Occupa 2/3 dello spazio disponibile */
            padding: 20px;
            border: 2px solid #007bff;
            border-radius: 5px;
            background-color: #e9f5ff;
            min-height: 200px; /* Altezza minima per visualizzare bene il div */
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 95%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .dati-utente p {
            margin: 5px 0;
        }

        .dati-utente strong {
            color: #333;
        }
    </style>
</head>
<body>

    <div id="modulo-container">
        <h2>Inserisci i Dati</h2>
        <form id="utenteForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="cognome">Cognome:</label>
            <input type="text" id="cognome" name="cognome" required>

            <label for="indirizzo">Indirizzo:</label>
            <input type="text" id="indirizzo" name="indirizzo" required>

            <button type="submit">Visualizza Dati</button>
        </form>
    </div>

    <div id="output-container">
        <h2>Dati Inseriti</h2>
        <div id="datiOutput" class="dati-utente">
            <p>I dati appariranno qui dopo l'invio del modulo.</p>
        </div>
    </div>

    <script>
        // JavaScript per gestire l'evento di invio del modulo
        document.getElementById('utenteForm').addEventListener('submit', function(event) {
            // Impedisce il ricaricamento della pagina (comportamento predefinito del form)
            event.preventDefault();

            // 1. Recupera i valori inseriti dall'utente
            const nome = document.getElementById('nome').value;
            const cognome = document.getElementById('cognome').value;
            const indirizzo = document.getElementById('indirizzo').value;

            // 2. Crea il contenuto HTML da stampare
            const outputHTML = `
                <p><strong>Nome:</strong> ${nome}</p>
                <p><strong>Cognome:</strong> ${cognome}</p>
                <p><strong>Indirizzo:</strong> ${indirizzo}</p>
            `;

            // 3. Inserisce il contenuto nel div di output
            document.getElementById('datiOutput').innerHTML = outputHTML;

            // Opzionale: pulisce i campi del form dopo l'invio
            document.getElementById('utenteForm').reset();
        });
    </script>
</body>
</html>
